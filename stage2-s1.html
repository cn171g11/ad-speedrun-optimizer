<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>② S1 · 1 IP → 通关 C9 | 工作台</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="s1.css" />
</head>
<body>
<header class="topbar glass">
  <div class="brand">
    <span class="logo">S1</span>
    <div>
      <h1>S1 段 · 1 IP → 通关 C9 · 工作台</h1>
      <p>模型估计与扫描结果（非实测秒级精度）</p>
    </div>
  </div>
</header>
<main>
  <nav class="subnav glass" id="subnav"></nav>

  <div id="s1Version"></div>

  <!-- 首屏优先：总耗时 + 操作表 -->
  <section class="s1-block">
    <h2>操作表 · <span id="s1SelectedName"></span></h2>
    <p class="s1-meta" id="s1SelectedMeta"></p>
    <div class="runbtns" style="margin-bottom:12px">
      <label class="s1-label" for="s1FlowFilter">筛选操作表</label>
      <input id="s1FlowFilter" class="s1-filter" type="text" placeholder="操作流程 / 购买项目 / 数量" />
    </div>
    <div id="s1Flow"></div>
  </section>

  <!-- 候选路线：默认折叠 -->
  <details class="s1-block">
    <summary class="s1-summary">候选路线（90 条 · 含未完成的超时路线）</summary>
    <div id="s1Candidates"></div>
  </details>

  <section class="s1-block">
    <h2>说明</h2>
    <p class="s1-disclaimer">本工作台所有时间为 <b>模型估计</b>，非实测秒级精度；路线为<b>扫描范围内最短</b>，<b>非全局最优</b>。「未验证」路线不参与排序。</p>
  </section>

  <section class="s1-block">
    <h2>假设</h2>
    <div id="s1Assumptions"></div>
  </section>

  <section class="s1-block">
    <h2>路线对比</h2>
    <div id="s1Comparison"></div>
  </section>

  <section class="s1-block">
    <h2>复算 C9</h2>
    <p class="hint">点击下方按钮现场复算通关 C9 的耗时，仅报告成功或超时。</p>
    <div class="runbtns">
      <button id="s1RecomputeC9" class="btn" type="button">复算 C9</button>
    </div>
    <div id="s1C9Result" class="c9-result"></div>
  </section>

  <section class="s1-block">
    <h2>无限升级网格</h2>
    <div id="s1IU"></div>
  </section>

  <section class="s1-block">
    <h2>敏感性</h2>
    <div id="s1Sensitivity"></div>
  </section>
</main>
<footer class="glass">
  <span>仿真：js/model.js + js/s1sim.js　·　数据合同：s1-audit-1</span>
  <span>Stage 2 · ② S1</span>
</footer>
<script src="js/nav.js"></script>
<script src="js/model.js"></script>
<script src="js/s1sim.js"></script>
<script src="js/s1flow.js"></script>
<script src="js/s1render.js"></script>
</body>
</html>
